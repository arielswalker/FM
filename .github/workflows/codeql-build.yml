name: CodeQl Analysis

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  codeql:
    name: Codeql Analysis
    uses: arielswalker/cFS/.github/workflows/codeql-reusable.yml@test-cfs/workflows136
    with:
      component-path: apps/fm
      prep: 'make prep; make -C build/tools/elf2cfetbl'
      make: make -C build/native/default_cpu1/apps/fm
